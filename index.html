<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="base-uri 'self'; object-src 'none'; form-action 'self' https://github.com" />
  <meta name="description" content="CCFDDL Open Deadlines helps researchers track worldwide conference deadlines through collaboration." />
  <meta name="keywords" content="conference deadlines" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>ccf-deadlines</title>
  <script id="startup-recovery">
    (function () {
      var timer;
      var finished = false;
      var failedBeforeReady = false;
      function stop() {
        finished = true;
        window.clearTimeout(timer);
        window.removeEventListener('error', onError, true);
        window.removeEventListener('unhandledrejection', recover);
      }
      function recover() {
        if (finished) return;
        var loading = document.getElementById('initial-loading');
        if (!loading) {
          if (document.readyState === 'loading') failedBeforeReady = true;
          else stop();
          return;
        }
        loading.querySelector('span').textContent = 'Unable to finish loading. Please retry.';
        loading.querySelector('button').hidden = false;
        window.clearTimeout(timer);
      }
      function onError(event) {
        var source = event.filename || (event.target && event.target.src);
        if (source && new URL(source, window.location.href).origin !== window.location.origin) return;
        if (event.error || (event.target && event.target.tagName === 'SCRIPT')) recover();
      }
      function start() {
        if (finished) return;
        var loading = document.getElementById('initial-loading');
        if (!loading) return;
        loading.querySelector('button').addEventListener('click', function () {
          window.location.reload();
        });
        if (failedBeforeReady) recover();
        else timer = window.setTimeout(recover, 30000);
      }
      window.addEventListener('error', onError, true);
      window.addEventListener('unhandledrejection', recover);
      window.addEventListener('TrunkApplicationStarted', stop, { once: true });
      document.addEventListener('DOMContentLoaded', start, { once: true });
    }());
  </script>
  <!-- Load analytics after the app's critical resources and first paint. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.addEventListener('load', function () {
      var loadAnalytics = function () {
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-RY374M6FJ8';
        document.head.appendChild(script);
        gtag('js', new Date());
        gtag('config', 'G-RY374M6FJ8');
      };
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(loadAnalytics, { timeout: 3000 });
      } else {
        window.setTimeout(loadAnalytics, 1000);
      }
    }, { once: true });
  </script>

  <!-- Add a plain CSS file: see https://trunkrs.dev/assets/#css -->
  <!-- If using Tailwind with Leptos CSR, see https://trunkrs.dev/assets/#tailwind instead-->
  <link data-trunk rel="css" href="public/styles.css" />
  <link rel="preload" href="/conference/initial.json" as="fetch" type="application/json" crossorigin="anonymous" fetchpriority="high" />

  <!-- Include favicon in dist output: see https://trunkrs.dev/assets/#icon -->
  <link data-trunk rel="icon" href="public/favicon.ico" />

  <!-- include support for `wasm-bindgen --weak-refs` - see: https://rustwasm.github.io/docs/wasm-bindgen/reference/weak-references.html -->
  <link data-trunk rel="rust" data-wasm-opt="z" data-weak-refs />

  <link rel="alternate" type="application/rss+xml" title="CCF Conference Deadlines (RSS)" href="https://ccfddl.com/conference/deadlines_en.xml" />

  <link data-trunk rel="copy-dir" href="public/conference">
</head>


<body>
  <div id="initial-loading" class="initial-loading" role="status" aria-live="polite">
    <span>Loading conference deadlines...</span>
    <button type="button" hidden>Retry</button>
  </div>
</body>

</html>
