<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RY374M6FJ8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-RY374M6FJ8');
  </script>

  <!-- Add a plain CSS file: see https://trunkrs.dev/assets/#css -->
  <!-- If using Tailwind with Leptos CSR, see https://trunkrs.dev/assets/#tailwind instead-->
  <link data-trunk rel="css" href="public/styles.css" />
  <link rel="preload" href="/conference/allconf.json" as="fetch" type="application/json" crossorigin="anonymous" />

  <!-- Include favicon in dist output: see https://trunkrs.dev/assets/#icon -->
  <link data-trunk rel="icon" href="public/favicon.ico" />

  <!-- include support for `wasm-bindgen --weak-refs` - see: https://rustwasm.github.io/docs/wasm-bindgen/reference/weak-references.html -->
  <link data-trunk rel="rust" data-wasm-opt="z" data-weak-refs />

  <link rel="alternate" type="application/rss+xml" title="CCF Conference Deadlines (RSS)" href="https://ccfddl.com/conference/deadlines_en.xml" />

  <link data-trunk rel="copy-dir" href="public/conference">
</head>


<body>
  <div id="initial-loading" class="initial-loading" role="status" aria-live="polite">
    <span>Loading conference deadlines...</span>
  </div>
  <script>
    // Pick the same language as src/pages/home.rs so Chinese visitors do not see English while the app loads.
    (function () {
      var english;
      try {
        var preference = localStorage.getItem("language_preference");
        if (preference === "en" || preference === "zh") {
          english = preference === "en";
        } else if (localStorage.getItem("use_english") === "true") {
          english = true;
        }
      } catch (error) {}
      if (english === undefined) {
        english = !(navigator.language || "").toLowerCase().startsWith("zh");
      }
      if (!english) {
        document.documentElement.lang = "zh-CN";
        document.querySelector("#initial-loading span").textContent = "正在加载会议截止日期…";
      }
    })();
  </script>
</body>

</html>
