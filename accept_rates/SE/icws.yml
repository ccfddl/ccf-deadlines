      rate: 0.12352941176470589
      source: https://doi.org/10.1109/ICWS55610.2022.00011
    # Regular-length selection from received conference submissions; 22 short and one invited paper excluded from numerator.
    - year: 2023
      submitted: 268
      accepted: 53
