name: MCP Check
on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/mcp_check.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Worker dependencies
        run: npm ci --no-audit --no-fund
        working-directory: worker
      - name: Test and bundle API and MCP Worker
        run: npm run check
        working-directory: worker
