name: MergeCheck
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Assemble yml files
        run: python scripts/build_data.py
      - name: Test data loading and database limits
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Install Worker dependencies
        run: npm ci --no-audit --no-fund
        working-directory: worker
      - name: Test Worker security
        run: node --test worker/test/*.test.js scripts/test_startup.mjs
      # Install Rust Nightly Toolchain, with Clippy & Rustfmt
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - name: Test acceptance identity and cache compatibility
        run: cargo test --lib acceptance_
      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Download and install Trunk binary
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.18.4/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
      - name: Build with Trunk
        # "${GITHUB_REPOSITORY#*/}" evaluates into the name of the repository
        # using --public-url something will allow trunk to modify all the href paths like from favicon.ico to repo_name/favicon.ico .
        # this is necessary for github pages where the site is deployed to username.github.io/repo_name and all files must be requested
        # relatively as favicon.ico. if we skip public-url option, the href paths will instead request username.github.io/favicon.ico which
        # will obviously return error 404 not found.
        run: ./trunk build --release
      - name: Test timeline pointer, touch, and keyboard interactions
        run: node scripts/test_timeline_browser.mjs dist
      - name: Generate crawlable conference pages
        run: python scripts/generate_seo_pages.py
      - name: Verify public MCP pages
        run: |
          test -s dist/mcp-support.html
          grep -Fq '<h1>CCFDDL Plugin Support</h1>' dist/mcp-support.html
          test -s dist/mcp-privacy.html
          grep -Fq '<h1>CCFDDL Plugin Privacy Policy</h1>' dist/mcp-privacy.html
          test -s dist/mcp-terms.html
          grep -Fq '<h1>CCFDDL Plugin Terms</h1>' dist/mcp-terms.html
