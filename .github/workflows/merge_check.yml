name: MergeCheck
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHROME_BINARY: /usr/bin/google-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test share-card browser and rendering
        run: |
          node --test scripts/test_share_browser.mjs
          python -m unittest discover -s scripts -p 'test_*share_image.py'
      - name: Validate conference YAML
        run: python scripts/validate.py
      - name: Assemble yml files
        run: python scripts/build_data.py
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Download and install Trunk binary
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.18.4/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
      - name: Build with Trunk
        run: ./trunk build --release
      - name: Generate crawlable conference pages
        run: python scripts/generate_seo_pages.py --skip-share-images
